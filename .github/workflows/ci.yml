name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game-extracted
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game-extracted/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  desktop:
    # Gera o executável para Windows (instalador NSIS + portátil .exe).
    runs-on: windows-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game-extracted/package-lock.json

      - name: Build do jogo (arquivo único)
        working-directory: game-extracted
        run: npm ci && npm run build

      - name: Prepara o app desktop
        shell: bash
        run: |
          mkdir -p desktop/app/dist
          cp game-extracted/dist/index.html desktop/app/dist/index.html

      - name: Instala deps do desktop
        working-directory: desktop
        shell: bash
        run: |
          {
            echo "cwd: $(pwd)"
            ls -la
            echo "node $(node -v) / npm $(npm -v)"
            npm install --ignore-scripts --no-audit --no-fund 2>&1
          } | tee npmci.log > /dev/null

      - name: Empacota (instalador + portátil)
        working-directory: desktop
        shell: bash
        run: npx electron-builder --win --publish never > eb.log 2>&1

      - name: Posta log de erro no repo (diagnóstico)
        if: failure()
        shell: bash
        run: |
          {
            echo "# Diagnóstico CI (run $GITHUB_RUN_ID, job desktop)"
            echo '```'
            tail -c 8000 desktop/npmci.log 2>/dev/null || echo "(sem npmci.log)"
            echo "== electron-builder =="
            tail -c 8000 desktop/eb.log 2>/dev/null || echo "(sem eb.log)"
            echo '```'
          } > CI-DIAG.md
          git add CI-DIAG.md
          git -c user.name="ci-bot" -c user.email="ci@users.noreply.github.com" commit -m "diag desktop run $GITHUB_RUN_ID" || true
          for i in 1 2 3 4 5; do
            git fetch origin arena/01a09da3-pr2 --quiet && git rebase FETCH_HEAD --quiet && git push origin HEAD:arena/01a09da3-pr2 --quiet && break || sleep 6
          done

      - name: Guarda os executáveis como artefato
        uses: actions/upload-artifact@v4
        with:
          name: power-rangers-windows
          path: desktop/release/*.exe
          retention-days: 14

      - name: Publica no GitHub Releases
        if: github.ref == 'refs/heads/arena/01a09da3-pr2'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v1.1.0
          name: "Power Rangers: Batalha de Angel Grove — executável para Windows"
          body: |
            Jogo completo para PC (Windows 10/11, 64 bits). Escolha um:

            - **Setup** — instala o jogo e cria atalho na área de trabalho
            - **Portátil (.exe)** — sem instalação: baixe, dê dois cliques e jogue

            🎂 Na tela de título, digite **33** para a surpresa de aniversário!

            ⚠️ Como o arquivo não tem assinatura digital, o Windows SmartScreen pode avisar na
            primeira execução: clique em **"Mais informações" → "Executar assim mesmo"**.
          files: desktop/release/*.exe

  desktop-portable:
    # Versão "pasta com executável": zip com a pasta do jogo pronta para rodar.
    runs-on: windows-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game-extracted/package-lock.json

      - name: Build do jogo (arquivo único)
        working-directory: game-extracted
        run: npm ci && npm run build

      - name: Prepara o app desktop
        shell: bash
        run: |
          mkdir -p desktop/app/dist
          cp game-extracted/dist/index.html desktop/app/dist/index.html

      - name: Instala deps do desktop
        working-directory: desktop
        shell: bash
        run: |
          {
            echo "cwd: $(pwd)"
            echo "node $(node -v) / npm $(npm -v)"
            npm install --ignore-scripts --no-audit --no-fund 2>&1
          } | tee npmci.log > /dev/null

      - name: Empacota a pasta portátil (zip com o .exe)
        working-directory: desktop
        shell: pwsh
        run: |
          npx electron-packager ./app "Power Rangers Angel Grove" --platform=win32 --arch=x64 --electron-version=44.3.0 --out=out --overwrite --app-version=1.1.0 --icon=build/icon.ico --win32metadata.ProductName="Power Rangers Angel Grove" --win32metadata.FileDescription="Power Rangers - Batalha de Angel Grove" --win32metadata.CompanyName="TJ" *> portable.log
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path "out/Power Rangers Angel Grove-win32-x64" -DestinationPath "release/Power-Rangers-Angel-Grove-Windows-portable.zip" -Force
          Get-ChildItem release | Select-Object Name, Length

      - name: Posta log de erro no repo (diagnóstico)
        if: failure()
        shell: bash
        run: |
          {
            echo "# Diagnóstico CI (run $GITHUB_RUN_ID, job desktop-portable)"
            echo '```'
            tail -c 6000 desktop/npmci.log 2>/dev/null || echo "(sem npmci.log)"
            echo "== electron-packager =="
            tail -c 8000 desktop/portable.log 2>/dev/null || echo "(sem portable.log)"
            echo '```'
          } > CI-DIAG-PORTABLE.md
          git add CI-DIAG-PORTABLE.md
          git -c user.name="ci-bot" -c user.email="ci@users.noreply.github.com" commit -m "diag portable run $GITHUB_RUN_ID" || true
          for i in 1 2 3 4 5; do
            git fetch origin arena/01a09da3-pr2 --quiet && git rebase FETCH_HEAD --quiet && git push origin HEAD:arena/01a09da3-pr2 --quiet && break || sleep 6
          done

      - name: Publica o zip no GitHub Releases
        if: github.ref == 'refs/heads/arena/01a09da3-pr2'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-portable-v1.1.0
          name: "Power Rangers — pasta com executável (Windows, portátil)"
          body: |
            Baixe o zip, **extraia** e dê dois cliques em `Power Rangers Angel Grove.exe`.

            🎂 Na tela de título, digite **33** para a surpresa de aniversário!

            ⚠️ Como o arquivo não tem assinatura digital, o Windows SmartScreen pode avisar na
            primeira execução: clique em **"Mais informações" → "Executar assim mesmo"**.
          files: desktop/release/*.zip
